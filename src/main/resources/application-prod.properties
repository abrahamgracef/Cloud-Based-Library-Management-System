# Production Profile Configuration for AWS RDS PostgreSQL

server.port=8080

# Spring Application Name
spring.application.name=library-management-system

# Database Configuration (AWS RDS PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://library-db.cluster-xxxx.us-east-1.rds.amazonaws.com:5432/librarydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# AWS S3 Bucket Name
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:library-management-system-covers-prod}

# AWS SNS Topic ARN
aws.sns.topic-arn=${AWS_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:123456789012:library-management-notifications-prod}

# AWS Region
aws.region=${AWS_REGION:us-east-1}

# Logging Configuration for Prod
logging.level.root=INFO
logging.level.com.library.management=INFO

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
